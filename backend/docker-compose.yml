version: '3.8'

services:
  # Databases
  mysql-products:
    image: mysql:latest
    container_name: mysql-products
    environment:
      MYSQL_DATABASE: product_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3306:3306"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-auth:
    image: postgres:latest
    container_name: postgres-auth
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: auth_db
    ports:
      - "5433:5432"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-customers:
    image: postgres:latest
    container_name: postgres-customers
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: customers_db
    ports:
      - "5432:5432"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  postgres-chat:
    image: postgres:latest
    container_name: postgres-chat
    environment:
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin
      POSTGRES_DB: chat_db
    ports:
      - "5434:5432"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 10s
      timeout: 5s
      retries: 5

  order-mysql:
    image: mysql:latest
    container_name: order-mysql
    environment:
      MYSQL_DATABASE: orders_db
      MYSQL_USER: admin
      MYSQL_PASSWORD: admin
      MYSQL_ROOT_PASSWORD: admin
    ports:
      - "3307:3306"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis-tracking-service:
    image: redis:7-alpine
    container_name: redis-tracking-service
    ports:
      - "6379:6379"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  rabbitmq2:
    image: rabbitmq:3-management-alpine
    container_name: rabbitmq2
    ports:
      - "5672:5672"
      - "15672:15672"
    networks:
      - lucho-express-network
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # Microservices
  ms-product-lucho-express:
    image: cotbert2/ms-products-lucho-express:ps
    container_name: ms-product-lucho-express
    environment:
      DB_HOST: mysql-products
      DB_PORT: 3306
    ports:
      - "8085:8085"
    networks:
      - lucho-express-network
    depends_on:
      mysql-products:
        condition: service_healthy
    restart: unless-stopped

  ms-auth-lucho-express:
    image: cotbert2/ms-auth-lucho-express:ps
    container_name: ms-auth-lucho-express
    environment:
      DB_HOST: postgres-auth
      DB_PORT: 5432
      CHAT_SERVICE_URL: http://ms-chat:3000
    ports:
      - "8081:8081"
    networks:
      - lucho-express-network
    depends_on:
      postgres-auth:
        condition: service_healthy
    restart: unless-stopped

  ms-customer-lucho-express:
    image: cotbert2/ms-customer-lucho-express:ps
    container_name: ms-customer-lucho-express
    environment:
      DB_HOST: postgres-customers
      DB_PORT: 5432
    ports:
      - "8082:8082"
    networks:
      - lucho-express-network
    depends_on:
      postgres-customers:
        condition: service_healthy
    restart: unless-stopped

  ms-orders-lucho-express:
    image: cotbert2/ms-order-lucho-express:ps
    container_name: ms-orders-lucho-express
    environment:
      DB_HOST: order-mysql
      DB_PORT: 3306
      PRODUCT_SERVICE_URL: http://ms-product-lucho-express:8085
      CUSTOMER_SERVICE_URL: http://ms-customer-lucho-express:8082
      Tracking_URL: http://ms-tracking-lucho-express:8086
    ports:
      - "8084:8084"
    networks:
      - lucho-express-network
    depends_on:
      order-mysql:
        condition: service_healthy
      ms-product-lucho-express:
        condition: service_started
      ms-customer-lucho-express:
        condition: service_started
    restart: unless-stopped

  ms-tracking-lucho-express:
    image: cotbert2/ms-tracking-lucho-express:ps
    container_name: ms-tracking-lucho-express
    environment:
      REDIS_HOST: redis-tracking-service
      REDIS_PORT: 6379
      ORDER_SERVICE_URL: http://ms-orders-lucho-express:8084
      CUSTOMER_SERVICE_URL: http://ms-customer-lucho-express:8082
    ports:
      - "8086:8086"
    networks:
      - lucho-express-network
    depends_on:
      redis-tracking-service:
        condition: service_healthy
    restart: unless-stopped

  ms-chat:
    image: cotbert2/ms-chat-lucho-express:ps
    container_name: ms-chat
    environment:
      DB_HOST: postgres-chat
      DB_PORT: 5432
      DB_USER: admin
      DB_PASSWORD: admin
      DB_DATABASE: chat_db
      RABBITMQ_URL: amqp://rabbitmq2:5672
      RABBITMQ_QUEUE: chat_queue
      NODE_ENV: development
    ports:
      - "3000:3000"
    networks:
      - lucho-express-network
    depends_on:
      postgres-chat:
        condition: service_healthy
      rabbitmq2:
        condition: service_healthy
    restart: unless-stopped

  api-gateway-lucho-express:
    image: cotbert2/api-gateway:ps
    container_name: api-gateway-lucho-express
    ports:
      - "8080:8080"
    networks:
      - lucho-express-network
    depends_on:
      - ms-auth-lucho-express
      - ms-customer-lucho-express
      - ms-product-lucho-express
      - ms-orders-lucho-express
      - ms-tracking-lucho-express
      - ms-chat
    restart: unless-stopped

  frontend-lucho-express:
    image: cotbert2/lucho-express-frontend:ps
    container_name: frontend-lucho-express
    ports:
      - "4200:80"
    networks:
      - lucho-express-network
    depends_on:
      - api-gateway-lucho-express
    restart: unless-stopped

networks:
  lucho-express-network:
    driver: bridge
